[project]
name = "noor-ai-backend"
version = "1.0.0"
description = "Noor AI — Islamic Knowledge Q&A Backend"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-aws>=1.0",
    "boto3>=1.34",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "hypothesis==6.165.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
